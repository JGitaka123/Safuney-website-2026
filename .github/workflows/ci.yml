name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # CI database (GitHub-hosted Postgres service). Production uses Neon via Vercel env vars.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/safuney_ci
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/safuney_shadow

jobs:
  checks:
    name: Lint, typecheck, build, placeholder guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safuney_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @safuney/db generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Create shadow database for the migrate check
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE safuney_shadow;'
      - name: Prisma migrate check (migrations describe the schema)
        run: pnpm migrate:check
      - name: Migrate CI database
        run: pnpm --filter @safuney/db migrate:deploy
      - name: Seed demo catalogue (integration tests search it)
        run: pnpm --filter @safuney/db seed
        env:
          SEED_DEMO: "1"
      - name: Unit and integration tests
        run: pnpm test
      - name: Build (prebuild runs prisma generate and migrate deploy)
        run: pnpm build
      - name: Placeholder guard
        run: pnpm guard:placeholders

  e2e:
    name: Playwright + axe (mobile first)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safuney_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @safuney/db generate
      - run: pnpm --filter @safuney/db migrate:deploy
      - run: pnpm --filter @safuney/db seed
        env:
          SEED_DEMO: "1"
      # Built here rather than shipped from the checks job: Turbopack links externals such as
      # @prisma/client into .next/node_modules as symlinks into the pnpm store, which do not survive an
      # artifact round-trip.
      - name: Build
        run: pnpm --filter @safuney/web build
      - name: Install Playwright browsers
        run: pnpm --filter @safuney/web exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm --filter @safuney/web test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile, >= 95)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safuney_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @safuney/db generate
      - run: pnpm --filter @safuney/db migrate:deploy
      - run: pnpm --filter @safuney/db seed
        env:
          SEED_DEMO: "1"
      - name: Build
        run: pnpm --filter @safuney/web build
      - name: Lighthouse CI
        run: pnpm --filter @safuney/web lhci
        env:
          SITE_PAGES: /,/products,/products/disinfection,/products/disinfection/qac-surface-food-contact-sanitiser,/cart,/contact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 7
