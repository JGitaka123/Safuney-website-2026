name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Browser jobs exercise checkout without provider accounts.
  PAYMENTS_MODE: mock
  # Payment return URLs are built from the configured site URL; match the Playwright base URL.
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  # Auth.js needs a secret to sign sessions; this one is for CI only (production uses a Vercel secret).
  AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
  # CI database (GitHub-hosted Postgres service). Production uses Neon via Vercel env vars.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/safuney_ci
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/safuney_shadow

jobs:
  checks:
    name: Lint, typecheck, build, placeholder guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safuney_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @safuney/db generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Create shadow database for the migrate check
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE safuney_shadow;'
      - name: Prisma migrate check (migrations describe the schema)
        run: pnpm migrate:check
      - name: Migrate CI database
        run: pnpm --filter @safuney/db migrate:deploy
      - name: Seed demo catalogue (integration tests search it)
        run: pnpm --filter @safuney/db seed
        env:
          SEED_DEMO: "1"
      # `pnpm test` runs the packages one at a time (workspace-concurrency=1) on purpose: they share
      # one Postgres, and running them together let another package's fixtures churn underneath the
      # admin CSV import, which walks every variant in one transaction.
      - name: Unit and integration tests
        run: pnpm test
      - name: Build (prebuild runs prisma generate and migrate deploy)
        run: pnpm build
      # Non-negotiable: a feature whose service is not configured switches itself off, it does not
      # break the build. Vercel builds previews without secrets, so this is the check that catches it.
      - name: Build with no services configured
        run: pnpm --filter @safuney/web build
        env:
          DATABASE_URL: ""
          SHADOW_DATABASE_URL: ""
          AUTH_SECRET: ""
          PAYMENTS_MODE: ""
          NEXT_PUBLIC_SITE_URL: ""
      - name: Placeholder guard
        run: pnpm guard:placeholders
      - name: Money type guard
        run: pnpm guard:money
      - name: Swahili catalogue guard
        run: pnpm guard:i18n

  e2e:
    name: Playwright + axe (mobile first)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safuney_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @safuney/db generate
      - run: pnpm --filter @safuney/db migrate:deploy
      - run: pnpm --filter @safuney/db seed
        env:
          SEED_DEMO: "1"
      # Built here rather than shipped from the checks job: Turbopack links externals such as
      # @prisma/client into .next/node_modules as symlinks into the pnpm store, which do not survive an
      # artifact round-trip.
      - name: Build
        run: pnpm --filter @safuney/web build
      - name: Install Playwright browsers
        # --with-deps runs apt-get, whose mirrors fail often enough to redden a green PR. Retry the
        # whole step, then fall back to the browser download alone (the runner image already carries
        # the system libraries); only a real browser-download failure stops the job.
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @safuney/web exec playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "apt dependencies could not be installed; trying the browser download on its own"
          pnpm --filter @safuney/web exec playwright install chromium
      - name: Run e2e
        run: pnpm --filter @safuney/web test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile, >= 95)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safuney_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @safuney/db generate
      - run: pnpm --filter @safuney/db migrate:deploy
      - run: pnpm --filter @safuney/db seed
        env:
          SEED_DEMO: "1"
      - name: Build
        run: pnpm --filter @safuney/web build
      - name: Lighthouse CI
        run: pnpm --filter @safuney/web lhci
        env:
          SITE_PAGES: /,/products,/products/disinfection,/products/disinfection/saf-quartsan,/cart,/checkout,/contact,/sign-in,/quote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 7
